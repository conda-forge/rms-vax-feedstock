{% set name = "rms-vax" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/rms_vax-{{ version }}.tar.gz
  sha256: 5fc6a93081add9a07c26e9fe6739f1415886ed169978e35b657f75da3c7b51e4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }}
    - numpy

test:
  imports:
    - vax
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/SETI/rms-vax
  summary: Routines for converting to and from vax single-precision floating-point values
  dev_url: https://github.com/SETI/rms-vax
  doc_url: https://rms-vax.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rfrenchseti
    - Sierra-MC
